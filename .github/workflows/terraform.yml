name: My Terraform Checker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose whether to Deploy or Destroy infrastructure'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

jobs:
  check-my-code:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
    - name: Get code from GitHub
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Initialize Terraform
      run: terraform init

    - name: Check Terraform Formatting
      run: terraform fmt -check

    # This step runs ONLY if you push code OR choose 'deploy' from the manual menu
    - name: Deploy Infrastructure
      if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
      run: terraform apply -auto-approve

    # This step runs ONLY if you manually select 'destroy' from the GitHub Actions page
    - name: Destroy Infrastructure
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}
      run: terraform destroy -auto-approve
